[package]
name = "llm_os_runtime"
version = "1.0.0"
edition = "2021"
description = "LLM-OS v1.0 runtime — in-process inference (FFI) + KV pager + WASM sandbox + cartridge dispatcher."
license = "Apache-2.0"

[lib]
path = "lib.rs"

[[bin]]
name = "iod"
path = "iod_main.rs"

[[bin]]
name = "compile_schemas"
path = "compile_schemas_main.rs"

[features]
default = ["legacy-server", "legacy-handlers"]
# Phase 1: In-process inference via FFI to llama.cpp.
# Requires llama.cpp vendored at runtime/vendor/llama.cpp and build.rs.
ffi-inference = []
# Legacy mode: communicate with llama-server over HTTP/SSE.
legacy-server = []
# Phase 3: WASM cartridge sandbox via wasmtime.
wasm-sandbox = ["dep:wasmtime"]
# Keep in-process Rust handlers (default until WASM is fully wired).
legacy-handlers = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
ureq = { version = "2.10", features = ["json"] }
jsonschema = "0.18"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
wasmtime = { version = "21", optional = true }

# [build-dependencies]
# cc = "1.0"  # Uncomment when ffi-inference is wired with vendor/llama.cpp

[dev-dependencies]
# (none — tests are inline)
