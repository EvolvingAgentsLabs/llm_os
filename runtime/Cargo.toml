[package]
name = "llm_os_runtime"
version = "0.0.1"
edition = "2021"
description = "LLM-OS v0.01 runtime — bootloader (C) + I/O daemon (Rust) + cartridge dispatcher."
license = "Apache-2.0"

[lib]
path = "lib.rs"

[[bin]]
name = "iod"
path = "iod_main.rs"

[[bin]]
name = "compile_schemas"
path = "compile_schemas_main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
ureq = { version = "2.10", features = ["json"] }
jsonschema = "0.18"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
# (none — tests are inline)
