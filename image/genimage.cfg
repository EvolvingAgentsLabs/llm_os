# ──────────────────────────────────────────────────────────────────────
# genimage.cfg — SD card partition layout for LLM-OS on Pi 5
#
# Partition 1: boot    (FAT32, 128M)  — kernel, DTBs, firmware
# Partition 2: rootfs  (ext4,  64M)   — read-only, busybox + binaries
# Partition 3: model   (ext4,  rest)  — GGUF model, goal.txt, traces/
# ──────────────────────────────────────────────────────────────────────

image boot.vfat {
    vfat {
        files = {
            "bcm2712-rpi-5-b.dtb",
            "Image",
            "config.txt",
            "cmdline.txt"
        }
    }
    size = 128M
}

image rootfs.ext4 {
    ext4 {
        label = "rootfs"
    }
    size = 64M
}

image model.ext4 {
    ext4 {
        label = "model"
    }
    # Sized at build time — must fit the GGUF + headroom for traces
    size = 2048M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }

    partition model {
        partition-type = 0x83
        image = "model.ext4"
    }
}
