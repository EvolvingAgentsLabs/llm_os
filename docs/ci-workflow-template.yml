# GitHub Actions CI workflow template.
#
# This file ships under docs/ rather than .github/workflows/ because the
# OAuth token used for the v0.5-rc1 push lacks the `workflow` scope
# required to create files under .github/workflows/. To install:
#
#   1. Visit https://github.com/EvolvingAgentsLabs/llm_os
#   2. Press `.` to open the web editor (or click "Add file → Create new file")
#   3. Path: .github/workflows/ci.yml
#   4. Paste the contents below (everything starting at `name: CI`)
#   5. Commit directly to main
#
# Or grant `workflow` scope to your local git credentials and run:
#   cp docs/ci-workflow-template.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml
#   git commit -m "Install CI workflow"
#   git push

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # -D warnings would be ideal; for v0.5-rc1 we use -W (warn) so the
        # rc tag isn't held hostage to a single clippy lint. v1.0 final
        # tightens to -D warnings.
        run: cargo clippy --all-targets -- -W warnings

      - name: cargo test
        run: cargo test --all-targets

  grammar:
    name: grammar — validate fixtures via test-gbnf-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/validate_grammar.sh') }}

      - name: Clone + build llama.cpp validator
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git ../llama.cpp
          cd ../llama.cpp
          cmake -B build -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release --target test-gbnf-validator -j

      - name: Run validate_grammar.sh
        run: bash scripts/validate_grammar.sh

  python:
    name: python — lint scripts/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install --user ruff

      - name: ruff check
        run: ruff check scripts/
